<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">

      <a class="brand" href="#" aria-label="GreenLeaf home">
        <span class="brand-mark">✿</span><span><b>greenleaf</b><small>nursery management</small></span>
      </a>
      <div class="side-label">WORKSPACE</div>
      <nav class="nav-list" id="navigation">
        <button class="nav-item active" data-page="dashboard"><span>⌂</span>Dashboard</button>
        <button class="nav-item" data-page="plants"><span>♧</span>Plants & Products</button>
        <button class="nav-item" data-page="sales"><span>▤</span>Sales & Billing</button>
        <button class="nav-item" data-page="purchases"><span>⇩</span>Purchases</button>
        <button class="nav-item" data-page="customers"><span>♙</span>Customers</button>

        <div class="help-card"><span class="help-icon">✦</span><b>Grow better, every day.</b><p>Keep your nursery organized and thriving.</p></div>

          <button class="icon-button" id="topAddBtn" title="Add a plant">＋</button>

        </div>

      <section class="content" id="pageContent"></section>
      <footer>© 2026 GreenLeaf Nursery <span>•</span> Nursery Business Management Software</footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modalBackdrop">
    <section class="modal" id="modal" role="dialog" aria-modal="true"></section>
  </div>
  <script src="js/app.js?v=20261105-4"></script>
